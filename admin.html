<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0b"><title>Administração | ZapPlay</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-body"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">▶</span><span>ZAP<span>PLAY</span><small>ADMINISTRAÇÃO</small></span></a><a class="btn btn-outline" href="index.html">Ver site</a></header>
<main class="admin-main"><section id="loginPanel" class="login-card"><span class="eyebrow">ACESSO RESTRITO</span><h1>Painel administrativo</h1><p>Entre com sua conta autorizada para gerenciar o conteúdo do site.</p><form id="loginForm"><label>E-mail<input type="email" id="email" required autocomplete="username"></label><label>Senha<input type="password" id="password" required autocomplete="current-password"></label><button class="btn btn-red full">Entrar</button><p class="status" id="loginStatus"></p></form></section>
<section id="dashboard" hidden><div class="admin-heading"><div><span class="eyebrow">GERENCIAMENTO</span><h1>Painel ZapPlay</h1></div><button class="btn btn-outline" id="logout">Sair</button></div><div class="admin-tabs" id="adminTabs"><button data-tab="apps" class="active">Aplicativos</button><button data-tab="devices">Dispositivos</button><button data-tab="tutorials">Tutoriais</button><button data-tab="faqs">Perguntas</button><button data-tab="settings">Configurações</button></div><div class="admin-content"><div class="admin-list"><div class="list-head"><h2 id="listTitle">Aplicativos</h2><button class="btn btn-red" id="newItem">+ Adicionar</button></div><div id="itemsList"></div></div><form class="editor" id="editor" hidden><h2 id="editorTitle">Novo item</h2><div id="editorFields"></div><div class="editor-actions"><button class="btn btn-red">Salvar</button><button type="button" class="btn btn-outline" id="cancelEdit">Cancelar</button></div><p class="status" id="editorStatus"></p></form></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
